<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Galentine? 💖</title>
  <title>cuz everything is better when am with u🥰🎀</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --pink-primary: #FFADCB; /* */
            --pink-dark: #FF85B3;    /* */
            --lavender: #D4C1EC;     /* */
            --cream: #FFF9FB;        /* */
            --text-color: #7A5C61;   /* */
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--cream);
            color: var(--text-color);
            overflow-x: hidden;
            scroll-behavior: smooth; /* */
        }

        /* Floating Hearts */
        .heart {
            position: fixed;
            top: -10%;
            font-size: 20px;
            color: var(--pink-dark);
            z-index: 1000;
            animation: fall linear forwards;
        }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        section { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

        /* Memories Carousel */
        .carousel { display: flex; gap: 20px; overflow-x: auto; padding: 40px; width: 100%; scrollbar-width: none; }
        .memory-card {
            min-width: 300px;
            background: white;
            padding: 15px;
            border-radius: 20px;
            border: 3px solid var(--pink-primary);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .memory-img { width: 100%; height: 350px; object-fit: contain; background: #fff; border-radius: 15px; margin-bottom: 10px; }

        /* Buttons */
        .btn-container { position: relative; height: 120px; width: 100%; max-width: 400px; }
        .btn { padding: 15px 35px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .yes-btn { background: var(--pink-dark); color: white; }
        .no-btn { background: var(--lavender); position: absolute; }

        #celebration { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--cream); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop><source src="song.mp3" type="audio/mpeg"></audio>

    <section id="landing">
        <h1 style="font-size: 3rem; color: var(--pink-dark);">Will You Be My Galentine? 🎀</h1>
        <button class="btn yes-btn" onclick="goToMemories()">Let's See! ✨</button>
    </section>

    <section id="memories">
        <h2 style="font-size: 2.5rem;">Heartfelt Memories ✨</h2>
        <div class="carousel">
            <div class="memory-card">
                <img src="Snapchat-1843248143.jpg" class="memory-img">
                <p>favv😍</p>
            </div>
            <div class="memory-card">
                <img src="Screenshot_20260212_171238_Photos.jpg" class="memory-img">
                <p>funday🥰</p>
            </div>
            <div class="memory-card">
                <img src="Screenshot_20260212_191634_Photos.jpg" class="memory-img">
                <p>😚😇 ✨</p>
            </div>
            <div class="memory-card">
                <img src="Screenshot_20260212_171338_Photos.jpg" class="memory-img">
                <p>cutiee 💖</p>
            </div>
        </div>
    </section>

    <section>
        <h1>So, what do you say?</h1>
        <div class="btn-container">
            <button class="btn yes-btn" onclick="startCelebration()">YES! 😍</button>
            <button class="btn no-btn" id="noBtn">No 🥺</button>
        </div>
    </section>

    <div id="celebration">
        <h1 style="font-size: 4rem;">🎉 YAYYY! 🎉</h1>
        <p><strong>When:</strong> Whenever you want jaanemann</p>
        <p><strong>Where:</strong> Our favorite spot</p>
    </div>

    <script>
        // Floating Hearts
        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }, 300);

        // Scroll and Start Music
        function goToMemories() {
            document.getElementById('memories').scrollIntoView();
            document.getElementById('bgMusic').play(); // Music starts when pics show
        }

        // No Button Masti
        const noBtn = document.getElementById('noBtn');
        let noCount = 0;
        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        });

        noBtn.addEventListener('click', () => {
            noCount++;
            if(noCount === 1) alert("Don't u dare 😤");
            else alert("Plz dont babygurl 🥺");
        });

        // Yes Celebration
        function startCelebration() {
            document.getElementById('celebration').style.display = 'flex';
            confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 } });
        }
    </script>
</body>
</html>
